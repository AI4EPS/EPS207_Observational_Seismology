site_name: "EPS207 Observational Seismology"
site_description: ""
site_author: "Weiqiang Zhu"
docs_dir: docs/
repo_name: "AI4EPS/EPS207_Observational_Seismology"
repo_url: "https://github.com/AI4EPS/EPS207_Observational_Seismology"
edit_uri: blob/main/docs/

nav:
  - Overview: README.md
  - Final project: project.md
  - Introduction: lectures/00_introduction.md

theme:
  name: "material"
  features:
    - content.code.annotate
    - content.action.edit
    - navigation.expand

# Solutions must not reach the site at all: mkdocs-jupyter's `ignore` only stops them being
# RENDERED, and mkdocs still copies the raw .ipynb in as a static file.
exclude_docs: |
  notebooks/*_solution.ipynb

plugins:
  - mkdocs-jupyter:
      ignore_h1_titles: True
      include: ["notebooks/*.ipynb"]        # only this year's notebooks
      ignore: ["notebooks/*_solution.ipynb"] # solutions are released separately, after class

extra:
  generator: false
  analytics:
    provider: google
    property: G-JHM5N31W8F

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
