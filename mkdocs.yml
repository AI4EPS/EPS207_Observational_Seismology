site_name: "EPS207 Observational Seismology"
site_description: ""
site_author: "Weiqiang Zhu"
docs_dir: docs/
repo_name: "AI4EPS/EPS207_Observational_Seismology"
repo_url: "https://github.com/AI4EPS/EPS207_Observational_Seismology"
edit_uri: blob/main/docs/

nav:
  - Overview: README.md
  - Introduction: lectures/00_introduction.html
  - "Sep 8 · Regression & uncertainty": notebooks/01_regression_uncertainty.ipynb
  - "Sep 15 · Classification & bias-variance": notebooks/03_bias_variance.ipynb
  - Project dataset: notebooks/project_geysers_data.ipynb

theme:
  name: "material"
  features:
    - content.code.annotate
    - content.action.edit
    - navigation.expand

# Solutions must not reach the site at all: mkdocs-jupyter's `ignore` only stops them being
# RENDERED, and mkdocs still copies the raw .ipynb in as a static file.
exclude_docs: |
  notebooks/*_solution.ipynb
  lectures/*.md
  project.md
  notebooks/data/*
  notebooks/layers/*
  notebooks/my_*.csv
  notebooks/__pycache__/*

plugins:
  - mkdocs-jupyter:
      ignore_h1_titles: True
      include: ["notebooks/*.ipynb"]        # only this year's notebooks
      ignore: ["notebooks/*_solution.ipynb"] # nothing by that name should exist here

extra:
  generator: false
  analytics:
    provider: google
    property: G-JHM5N31W8F

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
